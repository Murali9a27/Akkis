<!doctype html>
<html lang="en">
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #fffbf4;
      font-family: Arial, Helvetica, sans-serif;
      color: #2c1810;
    "
  >
    <div
      style="
        max-width: 480px;
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid #e8d5b0;
        border-radius: 16px;
        padding: 28px;
      "
    >
      <h1 style="margin: 0 0 12px; font-size: 20px; color: #3b1f0a">Confirm your email</h1>
      <p style="margin: 0 0 20px; line-height: 1.6">
        Please confirm the email address for your Akki's Healthy Baking admin account.
      </p>
      <p style="margin: 0">
        <a
          href="{{ .RedirectTo }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email&amp;next=/admin"
          style="
            display: inline-block;
            background: #d4780a;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            padding: 12px 24px;
            border-radius: 999px;
          "
          >Confirm email</a
        >
      </p>
      <p style="margin: 20px 0 0; font-size: 12px; color: #6b4c3b">
        If you didn't expect this email, you can ignore it.
      </p>
    </div>
  </body>
</html>
