<!doctype html>
<html lang="en">
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #fffbf4;
      font-family: Arial, Helvetica, sans-serif;
      color: #2c1810;
    "
  >
    <div
      style="
        max-width: 480px;
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid #e8d5b0;
        border-radius: 16px;
        padding: 28px;
      "
    >
      <h1 style="margin: 0 0 12px; font-size: 20px; color: #3b1f0a">You're invited</h1>
      <p style="margin: 0 0 20px; line-height: 1.6">
        You have been invited to manage the Akki's Healthy Baking website. Use the button below to
        set your password. The link expires in 1 hour and can be used once.
      </p>
      <p style="margin: 0">
        <a
          href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=invite&amp;next=/admin/update-password"
          style="
            display: inline-block;
            background: #d4780a;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            padding: 12px 24px;
            border-radius: 999px;
          "
          >Set your password</a
        >
      </p>
      <p style="margin: 20px 0 0; font-size: 12px; color: #6b4c3b">
        If you weren't expecting this invitation, you can ignore this email.
      </p>
    </div>
  </body>
</html>
